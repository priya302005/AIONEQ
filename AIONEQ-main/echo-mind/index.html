<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="EchoMind is an AI-powered digital memory capsule that preserves your knowledge, experiences, and the way you think — not just your photos and videos."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&family=Lora:ital,wght@1,500&display=swap"
      rel="stylesheet"
    />
    <title>EchoMind — Your Memories. Your Mind. Preserved Forever.</title>
    <!--
      Content Security Policy (defense in depth).
      - 'unsafe-inline' is limited to style-src: React renders style="" attributes
        (allowed via style-src, not script-src).
      - https: in connect/media/img allows the Supabase API + storage (URL is a
        build-time secret, so the exact origin cannot be listed here).
      - script-src is strict ('self'); Vite dev re-adds 'unsafe-inline' for the
        react-refresh preamble via the CSP plugin in vite.config.js.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; base-uri 'self'; object-src 'none'; frame-src 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: https: http://localhost:4000; connect-src 'self' ws://localhost:5173 wss: https: http://localhost:4000;"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
